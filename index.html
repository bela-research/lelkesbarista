<!DOCTYPE HTML>
<html lang="hu">
    <head>
        <title>Lelkes Barista</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
        <link rel="stylesheet" href="assets/css/main.css" />
        <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>

        <style>
            /* Alapbeállítások, hogy ne legyen fehér villanás */
            html, body {
                height: 100%;
                margin: 0;
                padding: 0;
                background-color: #000;
            }

            /* --- HÁTTÉR FIXÁLÁSA --- */
            #bg {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-image: url('assets/css/images/bg.jpg');
                background-size: cover;
                background-position: center !important;
                background-repeat: no-repeat;
                z-index: -2; /* Minden mögé */
                will-change: transform;
                transform: scale(1);
            }

            /* Animáció csak akkor, ha nincs betöltési fázis */
            body:not(.is-preload) #bg {
                animation: floatBackground 50s infinite ease-in-out;
            }

            @keyframes floatBackground {
                0% { transform: scale(1); }
                50% { transform: scale(1.1); } 
                100% { transform: scale(1); }
            }

            #overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.4);
                z-index: -1; /* A kép fölé, de a tartalom alá */
            }

            /* --- TARTALOM --- */
            #wrapper {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
                z-index: 1;
            }

            #main {
                text-align: center;
                padding: 2em;
                max-width: 100%;
            }

            /* --- AVATAR ÉS STÍLUSOK --- */
            .avatar {
                display: block;
                margin: 0 auto 2em auto;
                width: 150px;
                height: 150px;
                border-radius: 50%;
                overflow: hidden;
                border: 3px solid rgba(255, 255, 255, 0.5);
            }

            .avatar img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            h1 { color: #fff; font-size: 2.5em; margin: 0; }
            h2 { color: rgba(255,255,255,0.8); font-weight: 300; }

            /* --- FORM --- */
            form {
                margin-top: 2em;
            }

            input[type="email"] {
                background: rgba(255, 255, 255, 0.1);
                border: 1px solid rgba(255, 255, 255, 0.3);
                border-radius: 30px;
                color: #fff;
                padding: 10px 20px;
                width: 250px;
                outline: none;
            }

            button {
                background: #fff;
                border: none;
                border-radius: 30px;
                padding: 10px 30px;
                font-weight: bold;
                cursor: pointer;
                margin-top: 10px;
            }

            /* Mobilos fix: ne zoomoljon, ne másszon el */
            @media screen and (max-width: 480px) {
                #bg {
                    animation: none !important;
                    background-attachment: scroll !important;
                }
            }
        </style>
    </head>
    <body class="is-preload">
        <div id="wrapper">
            <div id="bg"></div>
            <div id="overlay"></div>
            
            <div id="main">
                <header id="header">
                    <span class="avatar"><img src="images/avatar.jpg" alt="" /></span>
                    <h1>Lelkes Barista</h1>
                    <h2>A tökéletes kávéélményhez vezető úton</h2>
                    <p style="color: rgba(255,255,255,0.6);">Keress bizalommal</p>

                    <form id="contact-form" action="https://formspree.io/f/xzdvwlwz" method="POST">
                        <input type="email" name="email" placeholder="Email címed..." required>
                        <br>
                        <button id="submit-btn" type="submit">Küldés</button>
                    </form>
                </header>

                <footer id="footer" style="margin-top: 2em; color: rgba(255,255,255,0.4);">
                    &copy; Lelkes Barista
                </footer>
            </div>
        </div>
        
        <script>
            // Amint betölt az oldal, levesszük a preloadot, így indul az animáció
            window.addEventListener('load', function() {
                document.body.classList.remove('is-preload');
            });

            // Form küldés (eredeti scripted rövidítve a lényegre)
            var form = document.getElementById("contact-form");
            form.addEventListener("submit", async function(event) {
                event.preventDefault();
                var button = document.getElementById("submit-btn");
                button.innerHTML = "Küldés...";
                var data = new FormData(event.target);
                fetch(event.target.action, {
                    method: form.method,
                    body: data,
                    headers: { 'Accept': 'application/json' }
                }).then(response => {
                    if (response.ok) {
                        button.innerHTML = "Köszönöm!";
                        button.style.backgroundColor = "#4CAF50";
                        button.style.color = "#fff";
                        form.reset();
                    }
                });
            });
        </script>
    </body>
</html>
