<!DOCTYPE HTML>
<html lang="hu">
    <head>
        <title>Lelkes Barista</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
        <link rel="stylesheet" href="assets/css/main.css" />
        <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>

        <style>
            /* --- HÁTTÉR ÉS ANIMÁCIÓ FIXÁLÁSA --- */
            
            /* Ez a réteg felel a képért */
            #bg {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-image: url('assets/css/images/bg.jpg');
                background-size: cover;
                background-position: center !important;
                background-repeat: no-repeat;
                z-index: -2;
                transform: scale(1);
                will-change: transform;
            }

            /* Ez a réteg hozza vissza a "kis csíkokat" (pattern) */
            #overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                /* Az eredeti rácsháló effekt: */
                background-image: url('assets/css/images/overlay.png'), url('assets/css/images/overlay.png');
                background-color: rgba(0, 0, 0, 0.3);
                z-index: -1;
            }

            /* Lebegő animáció - csak ha már betöltött */
            body:not(.is-preload) #bg {
                animation: floatBackground 50s infinite ease-in-out;
            }

            @keyframes floatBackground {
                0% { transform: scale(1); }
                50% { transform: scale(1.1); } 
                100% { transform: scale(1); }
            }

            /* --- EGYÉB STÍLUSOK (Hogy minden ott legyen, ahol kell) --- */
            #wrapper {
                height: 100vh;
                width: 100%;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                position: relative;
                z-index: 1;
            }

            .avatar {
                display: block;
                margin: 0 auto 1.5em auto;
                width: 150px;
                height: 150px;
                border-radius: 50%;
                overflow: hidden;
                border: 3px solid rgba(255, 255, 255, 0.5);
                box-shadow: 0 0 20px rgba(0,0,0,0.5);
            }

            .avatar img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            h1 { font-size: 2.5em; color: #fff; margin: 0; letter-spacing: 2px; }
            h2 { font-size: 1.2em; color: rgba(255,255,255,0.8); font-weight: 300; margin-top: 0.5em; }

            form { margin-top: 2em; }
            input[type="email"] {
                background: rgba(255, 255, 255, 0.15);
                border: 1px solid rgba(255, 255, 255, 0.3);
                border-radius: 40px;
                color: #fff;
                padding: 12px 25px;
                width: 280px;
                text-align: center;
                outline: none;
                transition: background 0.3s;
            }
            input[type="email"]:focus { background: rgba(255, 255, 255, 0.25); }

            button {
                background: #fff;
                border: none;
                border-radius: 40px;
                padding: 12px 40px;
                font-weight: 700;
                margin-top: 15px;
                cursor: pointer;
                transition: transform 0.2s;
            }
            button:hover { transform: scale(1.05); }

            /* Mobilos finomhangolás */
            @media screen and (max-width: 480px) {
                #bg { animation: none !important; } /* Mobilon tiltsd le a zoomot, hogy ne legyen akadozás */
                h1 { font-size: 1.8em; }
                input[type="email"] { width: 220px; }
            }
        </style>
    </head>
    <body class="is-preload">
        <div id="wrapper">
            <div id="bg"></div>
            <div id="overlay"></div>
            
            <div id="main">
                <header id="header">
                    <span class="avatar"><img src="images/avatar.jpg" alt="Barista" /></span>
                    <h1>Lelkes Barista</h1>
                    <h2>A tökéletes kávéélményhez vezető úton</h2>
                    <p style="color: rgba(255,255,255,0.6); margin-top: 1em;">Keress bizalommal</p>

                    <form id="contact-form" action="https://formspree.io/f/xzdvwlwz" method="POST">
                        <input type="email" name="email" placeholder="Írd ide az email címed..." required>
                        <br>
                        <button id="submit-btn" type="submit">Küldés</button>
                    </form>
                </header>

                <footer id="footer" style="margin-top: 3em; color: rgba(255,255,255,0.3); font-size: 0.8em;">
                    &copy; Lelkes Barista
                </footer>
            </div>
        </div>
        
        <script>
            // Betöltés után levevődik a preload osztály, elindul az animáció
            window.addEventListener('load', function() {
                setTimeout(function() {
                    document.body.classList.remove('is-preload');
                }, 100);
            });

            // Form kezelő
            var form = document.getElementById("contact-form");
            form.addEventListener("submit", function(event) {
                event.preventDefault();
                var button = document.getElementById("submit-btn");
                button.innerHTML = "Küldés...";
                
                fetch(event.target.action, {
                    method: form.method,
                    body: new FormData(event.target),
                    headers: { 'Accept': 'application/json' }
                }).then(response => {
                    if (response.ok) {
                        button.innerHTML = "Köszönöm!";
                        button.style.background = "#4CAF50";
                        button.style.color = "#fff";
                        form.reset();
                    }
                });
            });
        </script>
    </body>
</html>
