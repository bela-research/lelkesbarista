<!DOCTYPE HTML>
<html lang="hu">
    <head>
        <title>Lelkes Barista</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
        <link rel="stylesheet" href="assets/css/main.css" />
        <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>

        <style>
            /* Alapértelmezett beállítások a nem kívánt görgetés ellen */
            body, html {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            #wrapper {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            /* --- KÉNYSZERÍTETT RÉTEGREND --- */
            #main {
                position: relative;
                z-index: 999 !important;
                text-align: center;
                width: 100%;
                padding: 20px;
            }

            /* --- 1. PROFILKÉP (AVATAR) --- */
            .avatar {
                display: block;
                margin: 0 auto 2em auto;
                width: clamp(100px, 18vw, 160px);
                height: clamp(100px, 18vw, 160px);
                border-radius: 50%;
                overflow: hidden;
                border: 3px solid rgba(255, 255, 255, 0.5);
                box-shadow: 0 0 15px rgba(0,0,0,0.3);
                position: relative;
            }

            .avatar img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

            /* --- 2. HÁTTÉR JAVÍTÁSA --- */
            @keyframes floatBackground {
                0% { transform: scale(1); }
                50% { transform: scale(1.08); } 
                100% { transform: scale(1); }
            }

            #bg {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-image: url('assets/css/images/bg.jpg');
                background-size: cover;
                background-position: center !important;
                background-repeat: no-repeat;
                
                /* Az animáció most már a középpontból zoomol */
                animation: floatBackground 50s infinite ease-in-out !important;
                transform-origin: center center;
                will-change: transform;
                z-index: 0; 
            }

            #overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: #000;
                opacity: 0.4; 
                z-index: 1;
            }

            /* --- 3. ŰRLAP ÉS GOMBOK --- */
            form {
                margin-top: 1.5em;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
                position: relative; 
                z-index: 10;
            }
            
            input[type="email"] {
                appearance: none;
                background: rgba(255, 255, 255, 0.15);
                border: solid 1px rgba(255, 255, 255, 0.3);
                border-radius: 2em;
                color: #ffffff; 
                display: block;
                outline: 0;
                padding: 0.75em 1.5em;
                text-decoration: none;
                width: 100%;
                max-width: 320px;
                font-size: 0.9em;
                transition: background 0.2s;
            }

            ::placeholder {
                color: rgba(255, 255, 255, 0.8) !important;
                opacity: 1;
            }

            input[type="email"]:focus {
                background: rgba(255, 255, 255, 0.25);
                border-color: #ffffff;
            }

            button {
                appearance: none;
                transition: all 0.3s ease-in-out; 
                background-color: #ffffff;
                border-radius: 2em;
                border: 0;
                color: #444;
                cursor: pointer;
                display: inline-block;
                font-weight: 700;
                height: 3em;
                line-height: 3em;
                padding: 0 2em;
                text-align: center;
                text-decoration: none;
                white-space: nowrap;
            }

            button:hover {
                background-color: rgba(255, 255, 255, 0.9);
                transform: translateY(-2px);
            }
            
            button.success {
                background-color: #4CAF50 !important; 
                color: white !important;
                pointer-events: none; 
            }

            button.error {
                background-color: #ff4444 !important; 
                color: white !important;
            }

            /* --- 4. TYPOGRAPHY --- */
            h1 { font-size: 2.5em !important; margin-bottom: 0.2em !important; letter-spacing: 0.1em; position: relative; z-index: 10; color: #fff; }
            h2 { font-size: 1.2em; margin-bottom: 1em; opacity: 0.8; font-weight: 300; position: relative; z-index: 10; color: #fff; }
            p.info { font-size: 0.9em; opacity: 0.6; margin-bottom: 0.5em; position: relative; z-index: 10; color: #fff; }

            /* Mobilos beállítások */
            @media screen and (max-width: 480px) {
                #bg {
                    animation: none !important; 
                    background-position: center !important;
                }
                h1 { font-size: 1.8em !important; }
                h2 { font-size: 1em; }
            }

            #footer {
                position: relative;
                z-index: 10;
                margin-top: 2em;
                color: rgba(255,255,255,0.5);
                font-size: 0.8em;
            }
        </style>
    </head>
    <body class="is-preload">
        <div id="wrapper">
            <div id="bg"></div>
            <div id="overlay"></div>
            
            <div id="main">
                <header id="header">
                    <span class="avatar">
                        <img src="images/avatar.jpg" alt="Avatar" />
                    </span>

                    <h1>Lelkes Barista</h1>
                    <h2>A tökéletes kávéélményhez vezető úton</h2>
                    <p class="info">Keress bizalommal</p>

                    <form id="contact-form" action="https://formspree.io/f/xzdvwlwz" method="POST">
                        <input type="email" name="email" placeholder="Írd ide az email címed..." required>
                        <button id="submit-btn" type="submit">Küldés</button>
                    </form>
                    
                    <p id="my-form-status"></p>
                </header>

                <footer id="footer">
                    <span class="copyright">&copy; Lelkes Barista</span>
                </footer>
            </div>
        </div>
        
        <script>
            // Betöltő animáció kezelése
            window.onload = function() { 
                document.body.classList.remove('is-preload'); 
            }

            // --- AJAX KÜLDÉS ---
            var form = document.getElementById("contact-form");
            var button = document.getElementById("submit-btn");
            
            async function handleSubmit(event) {
                event.preventDefault(); 
                var data = new FormData(event.target);
                
                button.innerHTML = "Küldés..."; 
                
                fetch(event.target.action, {
                    method: form.method,
                    body: data,
                    headers: {
                        'Accept': 'application/json'
                    }
                }).then(response => {
                    if (response.ok) {
                        button.innerHTML = "Köszönöm! Hamarosan keresem.";
                        button.classList.add("success"); 
                        form.reset(); 
                    } else {
                        response.json().then(data => {
                            button.innerHTML = "Hiba történt.";
                            button.classList.add("error"); 
                        })
                    }
                }).catch(error => {
                    button.innerHTML = "Hálózati hiba.";
                    button.classList.add("error");
                });
            }
            
            form.addEventListener("submit", handleSubmit);
        </script>
    </body>
</html>
